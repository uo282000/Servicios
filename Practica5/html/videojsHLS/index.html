<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Apple HLS con Video.js</title>
    <link href="https://vjs.zencdn.net/7.1.0/video-js.css" rel="stylesheet">
</head>
<body>
    <h1>HLS con Video.js</h1>
    <video id="my-video" class="video-js" controls preload="auto" width="640" height="264">
        <source src="http://192.168.0.27:1935/videodemanda/mp4:sample.mp4/playlist.m3u8" type="application/x-mpegURL">
        <p class="vjs-no-js">
            Para ver este video debes activar JavaScript y tener un navegador moderno que soporte HTML5 video.
        </p>
    </video>
    <script src="https://vjs.zencdn.net/7.1.0/video.js"></script>
    <script>
        var player = videojs('my-video');
    </script>
</body>
</html>
